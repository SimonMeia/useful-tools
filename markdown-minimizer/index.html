<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Markdown Stringifier</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
        <a href="/">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                class="w-8 h-8 text-gray-500 hover:text-gray-700 cursor-pointer fixed top-4 left-4"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 9.75l9-7.5 9 7.5v9.75a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 19.5V9.75z"
                />
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 22V12h6v10"
                />
            </svg>
        </a>
        <div class="max-w-4xl mx-auto w-full">
            <div class="bg-white rounded-lg shadow-lg">
                <div class="px-6 py-4 border-b border-gray-200 flex justify-between">
                    <h1 class="text-xl font-semibold text-gray-800">Markdown Stringifier</h1>
                </div>

                <div class="p-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label
                                for="markdownInput"
                                class="block text-sm font-medium text-gray-700 mb-1"
                            >
                                Markdown Input
                            </label>
                            <textarea
                                id="markdownInput"
                                class="block w-full h-96 rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border outline-none"
                                placeholder="Paste your Markdown here..."
                            ></textarea>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label
                                    for="stringifiedOutput"
                                    class="block text-sm font-medium text-gray-700"
                                >
                                    Stringified Output
                                </label>
                                <div class="flex items-center">
                                    <input
                                        id="wrapInQuotes"
                                        type="checkbox"
                                        checked
                                        class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500"
                                    />
                                    <label
                                        for="wrapInQuotes"
                                        class="ml-2 block text-sm text-gray-900"
                                        >Wrapped in " "</label
                                    >
                                </div>
                            </div>
                            <div class="h-96 flex flex-col gap-2">
                                <textarea
                                    id="stringifiedOutput"
                                    class="block w-full rounded-md border-gray-300 bg-gray-50 sm:text-sm px-3 py-2 border outline-none grow"
                                    readonly
                                ></textarea>
                                <button
                                    id="copyButton"
                                    class="w-full p-3 bg-blue-500 text-white font-medium rounded-lg border border-transparent hover:bg-blue-600 transition duration-200 ease-in-out"
                                >
                                    Copy to clipboard
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const markdownInput = document.getElementById('markdownInput')
            const stringifiedOutput = document.getElementById('stringifiedOutput')
            const copyButton = document.getElementById('copyButton')
            const wrapInQuotesCheckbox = document.getElementById('wrapInQuotes')

            function updateOutput() {
                const markdownText = markdownInput.value
                let stringified = JSON.stringify(markdownText)
                if (!wrapInQuotesCheckbox.checked) {
                    stringified = stringified.slice(1, -1)
                }
                stringifiedOutput.value = stringified
            }

            markdownInput.addEventListener('input', updateOutput)
            wrapInQuotesCheckbox.addEventListener('change', updateOutput)

            copyButton.addEventListener('click', () => {
                stringifiedOutput.select()
                document.execCommand('copy')
            })

            // Initial call to set the value
            updateOutput()
        </script>
    </body>
</html>
