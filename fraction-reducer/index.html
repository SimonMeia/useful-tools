<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Réducteur de Fractions</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
        <a href="/">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                class="w-8 h-8 text-gray-500 hover:text-gray-700 cursor-pointer fixed top-4 left-4"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 9.75l9-7.5 9 7.5v9.75a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 19.5V9.75z"
                />
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M9 22V12h6v10"
                />
            </svg>
        </a>

        <div class="w-full max-w-md">
            <div class="bg-white rounded-lg shadow-lg">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h1 class="text-xl font-semibold text-gray-800">Réducteur de Fractions</h1>
                </div>
                <div class="space-y-6 p-6">
                    <div class="flex items-center justify-center space-x-4">
                        <div class="flex flex-col items-center">
                            <input
                                type="number"
                                id="numerator"
                                class="w-24 text-center rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 text-2xl px-3 py-2 border outline-none"
                                placeholder="0"
                            />
                            <div class="w-24 h-1 bg-gray-800 my-2"></div>
                            <input
                                type="number"
                                id="denominator"
                                class="w-24 text-center rounded-md border-gray-300 focus:border-indigo-500 focus:ring-indigo-500 text-2xl px-3 py-2 border outline-none"
                                placeholder="1"
                            />
                        </div>

                        <div class="text-3xl text-gray-500">=</div>

                        <div class="flex flex-col items-center">
                            <div
                                id="resultNumerator"
                                class="w-24 text-center text-2xl font-bold text-indigo-600"
                            >
                                —
                            </div>
                            <div class="w-24 h-1 bg-indigo-600 my-2"></div>
                            <div
                                id="resultDenominator"
                                class="w-24 text-center text-2xl font-bold text-indigo-600"
                            >
                                —
                            </div>
                        </div>
                    </div>

                    <div id="message" class="text-center text-sm text-gray-500">
                        Entrez une fraction pour la réduire
                    </div>
                </div>
            </div>
        </div>

        <script>
            const numeratorInput = document.getElementById('numerator')
            const denominatorInput = document.getElementById('denominator')
            const resultNumerator = document.getElementById('resultNumerator')
            const resultDenominator = document.getElementById('resultDenominator')
            const message = document.getElementById('message')

            // Calcul du PGCD (Plus Grand Commun Diviseur) avec l'algorithme d'Euclide
            function gcd(a, b) {
                a = Math.abs(a)
                b = Math.abs(b)
                while (b !== 0) {
                    const temp = b
                    b = a % b
                    a = temp
                }
                return a
            }

            function reduceFraction() {
                const num = parseInt(numeratorInput.value)
                const den = parseInt(denominatorInput.value)

                // Vérification des entrées
                if (isNaN(num) || isNaN(den)) {
                    resultNumerator.textContent = '—'
                    resultDenominator.textContent = '—'
                    message.textContent = 'Entrez une fraction pour la réduire'
                    message.className = 'text-center text-sm text-gray-500'
                    return
                }

                if (den === 0) {
                    resultNumerator.textContent = '—'
                    resultDenominator.textContent = '—'
                    message.textContent = 'Division par zéro impossible'
                    message.className = 'text-center text-sm text-red-500'
                    return
                }

                // Calcul de la fraction irréductible
                const divisor = gcd(num, den)
                let reducedNum = num / divisor
                let reducedDen = den / divisor

                // Gestion du signe (le signe doit être au numérateur)
                if (reducedDen < 0) {
                    reducedNum = -reducedNum
                    reducedDen = -reducedDen
                }

                resultNumerator.textContent = reducedNum
                resultDenominator.textContent = reducedDen

                if (num === reducedNum && den === reducedDen) {
                    message.textContent = 'La fraction est déjà irréductible'
                    message.className = 'text-center text-sm text-green-600'
                } else {
                    message.textContent = `Divisé par ${divisor}`
                    message.className = 'text-center text-sm text-indigo-600'
                }
            }

            numeratorInput.addEventListener('input', reduceFraction)
            denominatorInput.addEventListener('input', reduceFraction)
        </script>
    </body>
</html>
